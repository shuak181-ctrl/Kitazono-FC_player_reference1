<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitazono Players - 選手名鑑</title>
  
  <!-- Google Fonts (Oswald & 日本語用フォントの読み込み) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pliant&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tourney:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
  <!-- style.css -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- 1. バナー（左端にロゴとチーム名） -->
  <div class="top-banner">
    <div class="banner-left">
      <img src="images/logo.png" alt="ロゴ" class="banner-logo">
      <span class="banner-team-name">KITAZONO FOOTBALL CLUB</span> <!-- ← ここにチーム名を入れてね -->
    </div>
  </div>

  <!-- 集合写真のスライダーエリア -->
  <div class="group-carousel-container">
    <button class="group-btn group-prev" id="group-prev">&#10094;</button>
    <button class="group-btn group-next" id="group-next">&#10095;</button>

    
    

    <div class="group-track" id="group-track">

        <!-- ★左ループ用（4枚目のコピー） -->
      <div class="group-slide"><img src="images/all4.JPG" alt="集合写真4"></div>

      <div class="group-slide"><img src="images/all1.JPG" alt="集合写真1"></div>
      <div class="group-slide"><img src="images/all2.JPG" alt="集合写真2"></div>
      <div class="group-slide"><img src="images/all3.JPG" alt="集合写真3"></div>
      <div class="group-slide"><img src="images/all4.JPG" alt="集合写真4"></div>

      <!-- ★右ループ用（1枚目のコピー） -->
      <div class="group-slide"><img src="images/all1.JPG" alt="集合写真1"></div>
    </div>

    <!-- インジケーター（丸いドット） -->
    <div class="group-dots" id="group-dots">
      <span class="group-dot active" data-index="0"></span>
      <span class="group-dot" data-index="1"></span>
      <span class="group-dot" data-index="2"></span>
      <span class="group-dot" data-index="3"></span>
    </div>
  </div>

  <!-- 3. タイトル（Players and Staff） -->
  <div class="title-section">
    <h1 class="page-title">Players & Staff</h1>
  </div>


  <!-- ソート・絞り込みタブ -->
  <section class="sort-section">
    <p class="sort-label">Sorted by</p>
    
    <div class="sort-group position-sort">
      <button class="sort-btn active" data-filter="ALL">ALL</button>
      <button class="sort-btn" data-filter="GK">GK</button>
      <button class="sort-btn" data-filter="DF">DF</button>
      <button class="sort-btn" data-filter="MF">MF</button>
      <button class="sort-btn" data-filter="FW">FW</button>
      <button class="sort-btn" data-filter="MG">MG</button>
      <button class="sort-btn" data-filter="STAFF">STAFF</button>
    </div>

    <div class="sort-group grade-sort">
      <button class="sort-btn" data-filter="1年">1年</button>
      <button class="sort-btn" data-filter="2年">2年</button>
      <button class="sort-btn" data-filter="3年">3年</button>
    </div>
  </section>

  <!-- 選手一覧グリッド -->
  <main id="player-grid" class="player-grid">
    <!-- JSで30人分のカードが自動生成されます -->
  </main>
    <main id="player-grid" class="player-grid">
  <!-- ブログセクション -->
　<section class="blog-section">
  　<div class="title-section">
    　<h2 class="page-title">MEMBER BLOG</h2>
  　</div>
  　<div id="blog-grid" class="blog-grid">
    <!-- JSの fetch() により、ここに記事カードが自動挿入されます -->
  　</div>
　</section>

  <!-- モーダル（詳細画面） -->
  <div id="player-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal" class="close-btn">&times;</button>
      <div id="modal-body" class="modal-body">
        <!-- JSで詳細データが挿入されます -->
      </div>
    </div>
  </div>

  <script src="main.js"></script>
  　<!-- ブログ詳細モーダル -->
　<div id="blog-modal" class="blog-modal">
  　<div class="blog-modal-content">
    　<span class="blog-modal-close" onclick="closeBlogModal()">&times;</span>
    　<div id="blog-modal-body">
      <!-- JSにより記事全文が動的に挿入されます -->
    　</div>
  　</div>
　</div>
</body>
</html>
